<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 助手</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%232f6fed'/%3E%3Cpath d='M8 12h8M12 8v8' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fastly.jsdelivr.net/npm/highlight.js@11.11.1/styles/github-dark.min.css">
<style>
:root{
  --bg:#f3f5f9; --panel:#ffffff; --ink:#1a2233; --ink-2:#5b6577; --line:#e6eaf1;
  --brand:#2f6fed; --brand-2:#1e56c4; --brand-soft:#eaf1fe;
  --user-bubble:#2f6fed; --ai-bubble:#f1f4f9; --danger:#d64545;
  --radius:16px; --shadow:0 8px 30px rgba(30,60,120,.10);
  --side-w:248px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer}
input,textarea{font-family:inherit}

/* ===== 登录视图 ===== */
.auth-wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.auth-card{
  width:100%;max-width:380px;background:var(--panel);border-radius:22px;
  box-shadow:var(--shadow);padding:36px 32px;
}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--brand);display:flex;align-items:center;justify-content:center;flex:none}
.brand-mark svg{width:20px;height:20px}
.brand-name{font-size:19px;font-weight:700;letter-spacing:.3px}
.auth-sub{color:var(--ink-2);font-size:13.5px;margin:4px 0 26px}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;color:var(--ink-2);margin-bottom:7px}
.field input{
  width:100%;height:44px;padding:0 14px;border:1.5px solid var(--line);border-radius:12px;
  font-size:15px;background:#fafbfe;outline:none;transition:border-color .15s,box-shadow .15s;
}
.field input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft);background:#fff}
.auth-btn{
  width:100%;height:46px;border:none;border-radius:12px;background:var(--brand);color:#fff;
  font-size:15.5px;font-weight:600;transition:background .15s;
}
.auth-btn:hover{background:var(--brand-2)}
.auth-switch{margin-top:16px;text-align:center;font-size:13.5px;color:var(--ink-2)}
.auth-switch button{background:none;border:none;color:var(--brand);font-weight:600}
.auth-err{margin-top:14px;font-size:13.5px;color:var(--danger);min-height:18px}

/* ===== 主框架：侧边栏 + 内容 ===== */
.app-wrap{display:none;height:100vh}
.sidebar{
  width:var(--side-w);flex:none;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:18px 14px;gap:6px;
}
.side-brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.nav-item{
  display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border:none;border-radius:12px;
  background:transparent;color:var(--ink-2);font-size:14.5px;text-align:left;transition:background .15s,color .15s;
}
.nav-item svg{width:18px;height:18px;flex:none}
.nav-item:hover{background:var(--brand-soft);color:var(--brand)}
.nav-item.active{background:var(--brand-soft);color:var(--brand);font-weight:600}
.nav-new{border:1.5px dashed var(--line);color:var(--brand)}
.nav-new:hover{border-color:var(--brand)}

.side-section{margin-top:18px;padding:0 8px;font-size:12px;color:var(--ink-2);letter-spacing:.5px}
.conv-list{flex:1;overflow-y:auto;margin-top:8px;display:flex;flex-direction:column;gap:4px}
.conv-item{
  display:flex;align-items:center;gap:8px;width:100%;padding:10px 12px;border:none;border-radius:10px;
  background:transparent;color:var(--ink);font-size:13.5px;text-align:left;
  white-space:nowrap;overflow:hidden;transition:background .15s;
}
.conv-item:hover{background:var(--brand-soft)}
.conv-item.active{background:var(--brand-soft);color:var(--brand);font-weight:600}
.conv-item .conv-title{overflow:hidden;text-overflow:ellipsis}
.conv-empty{padding:10px 12px;font-size:13px;color:var(--ink-2)}

.side-foot{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.side-user{display:flex;align-items:center;gap:10px;padding:0 8px}
.side-avatar{width:34px;height:34px;border-radius:10px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.side-user .uname{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.logout-btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-size:13px;color:var(--ink-2)}
.logout-btn:hover{border-color:var(--brand);color:var(--brand)}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden}

/* ===== 主页 ===== */
.home-view{display:none;flex:1;overflow-y:auto;padding:36px 30px}
.home-inner{max-width:720px;margin:0 auto}
.home-card{
  background:var(--panel);border-radius:22px;box-shadow:var(--shadow);padding:34px 32px;
  display:flex;align-items:center;gap:22px;
}
.home-avatar{width:72px;height:72px;border-radius:22px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700;flex:none}
.home-info h2{font-size:22px;margin-bottom:6px}
.home-info p{color:var(--ink-2);font-size:14px}
.home-stats{display:flex;gap:14px;margin-top:22px;flex-wrap:wrap}
.stat-card{flex:1;min-width:150px;background:var(--panel);border-radius:18px;box-shadow:var(--shadow);padding:22px}
.stat-card .num{font-size:26px;font-weight:700;color:var(--brand)}
.stat-card .label{font-size:13px;color:var(--ink-2);margin-top:4px}
.home-actions{margin-top:26px;display:flex;gap:12px}
.primary-btn{border:none;background:var(--brand);color:#fff;border-radius:12px;padding:12px 20px;font-size:14.5px;font-weight:600}
.primary-btn:hover{background:var(--brand-2)}
.ghost-btn{border:1.5px solid var(--line);background:#fff;color:var(--ink-2);border-radius:12px;padding:12px 20px;font-size:14.5px}
.ghost-btn:hover{border-color:var(--brand);color:var(--brand)}

/* ===== 聊天视图 ===== */
.chat-view{display:none;flex:1;flex-direction:column;overflow:hidden}
.topbar{
  display:flex;align-items:center;justify-content:space-between;padding:14px 22px;
  background:var(--panel);border-bottom:1px solid var(--line);
}
.topbar-left{display:flex;align-items:center;gap:10px;min-width:0}
.topbar-title{font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar-user{font-size:13px;color:var(--ink-2)}

.messages{flex:1;overflow-y:auto;padding:26px 18px;display:flex;flex-direction:column;gap:20px}
.msg-row{display:flex;gap:12px;max-width:820px;width:100%;margin:0 auto;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.avatar{
  width:34px;height:34px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:14px;color:#fff;
}
.msg-row.user{flex-direction:row-reverse}
.msg-row.user .avatar{background:var(--ink-2)}
.msg-row.ai .avatar{background:var(--brand)}
.bubble{padding:12px 15px;border-radius:16px;font-size:15px;line-height:1.7;min-width:0;max-width:75%}
.msg-row.user .bubble{background:var(--user-bubble);color:#fff;border-top-right-radius:4px}
.msg-row.ai .bubble{background:var(--ai-bubble);color:var(--ink);border-top-left-radius:4px}

/* markdown 渲染 */
.bubble p{margin:.4em 0}
.bubble p:first-child{margin-top:0}
.bubble p:last-child{margin-bottom:0}
.bubble ul,.bubble ol{margin:.4em 0 .4em 1.3em}
.bubble li{margin:.25em 0}
.bubble h1,.bubble h2,.bubble h3{margin:.6em 0 .3em;line-height:1.3}
.bubble h1{font-size:1.25rem}.bubble h2{font-size:1.12rem}.bubble h3{font-size:1.05rem}
.bubble code{font-family:"Consolas","JetBrains Mono",monospace;font-size:.88em;background:rgba(47,111,237,.1);padding:1px 5px;border-radius:5px}
.msg-row.user .bubble code{background:rgba(255,255,255,.18)}
.bubble pre{background:#0d1424;border-radius:12px;padding:14px;overflow-x:auto;margin:.6em 0}
.bubble pre code{background:none;padding:0;color:#e6edf7;font-size:.86rem;line-height:1.6}
.bubble blockquote{border-left:3px solid var(--brand);padding-left:12px;color:var(--ink-2);margin:.5em 0}
.bubble table{border-collapse:collapse;margin:.5em 0}
.bubble th,.bubble td{border:1px solid var(--line);padding:6px 10px}
.bubble a{color:var(--brand)}
.cursor{display:inline-block;width:8px;height:16px;background:var(--brand);margin-left:2px;vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

.empty{margin:auto;text-align:center;color:var(--ink-2)}
.empty .big{font-size:30px;font-weight:700;margin-bottom:8px;color:var(--ink)}
.empty p{font-size:14.5px}

/* 输入区 */
.composer{padding:16px 18px 20px;background:var(--panel);border-top:1px solid var(--line)}
.composer-inner{max-width:820px;margin:0 auto;display:flex;gap:10px;align-items:flex-end}
.composer textarea{
  flex:1;resize:none;min-height:46px;max-height:160px;padding:12px 15px;border:1.5px solid var(--line);
  border-radius:14px;font-size:15px;outline:none;background:#fafbfe;line-height:1.5;
}
.composer textarea:focus{border-color:var(--brand);background:#fff}
.send-btn{
  width:46px;height:46px;border:none;border-radius:14px;background:var(--brand);color:#fff;flex:none;
  display:flex;align-items:center;justify-content:center;transition:background .15s;
}
.send-btn:hover{background:var(--brand-2)}
.send-btn:disabled{background:#a9c3f2;cursor:not-allowed}
.send-btn svg{width:20px;height:20px}
.hint{max-width:820px;margin:8px auto 0;font-size:12px;color:var(--ink-2);text-align:center}

@media (max-width:760px){
  :root{--side-w:72px}
  .nav-item span,.conv-item,.side-user .uname,.side-section,.brand-name{display:none}
  .bubble{max-width:85%}
  .messages{padding:18px 12px;gap:16px}
  .topbar{padding:12px 16px}
}
</style>
</head>
<body>

<!-- ===== 登录 / 注册 ===== -->
<div class="auth-wrap" id="authView">
  <div class="auth-card">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 3l2.2 5.6L20 11l-5.8 2.4L12 19l-2.2-5.6L4 11l5.8-2.4L12 3z" fill="#fff"/></svg>
      </div>
      <div class="brand-name">AI 助手</div>
    </div>
    <div class="auth-sub" id="authSub">登录后开始对话，回答以 Markdown 流式输出</div>
    <div class="field">
      <label>用户名</label>
      <input id="username" type="text" autocomplete="username" placeholder="请输入用户名">
    </div>
    <div class="field">
      <label>密码</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="请输入密码">
    </div>
    <button class="auth-btn" id="authBtn">登录</button>
    <div class="auth-switch">
      <span id="switchText">还没有账号？</span>
      <button id="switchBtn">去注册</button>
    </div>
    <div class="auth-err" id="authErr"></div>
  </div>
</div>

<!-- ===== 主框架 ===== -->
<div class="app-wrap" id="appView">
  <!-- 侧边栏 -->
  <aside class="sidebar">
    <div class="side-brand">
      <div class="brand-mark" style="width:30px;height:30px">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 3l2.2 5.6L20 11l-5.8 2.4L12 19l-2.2-5.6L4 11l5.8-2.4L12 3z" fill="#fff"/></svg>
      </div>
      <div class="brand-name">AI 助手</div>
    </div>

    <button class="nav-item" id="navHome">
      <svg viewBox="0 0 24 24" fill="none"><path d="M3 11l9-8 9 8M5 10v10h14V10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>主页</span>
    </button>
    <button class="nav-item" id="navChat">
      <svg viewBox="0 0 24 24" fill="none"><path d="M21 12a8 8 0 01-8 8H4l2-3a8 8 0 1115-5z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      <span>AI 会话</span>
    </button>
    <button class="nav-item nav-new" id="navNew">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>新会话</span>
    </button>

    <div class="side-section">历史会话</div>
    <div class="conv-list" id="convList"></div>

    <div class="side-foot">
      <div class="side-user">
        <div class="side-avatar" id="sideAvatar">U</div>
        <div class="uname" id="sideUsername"></div>
      </div>
      <button class="logout-btn" id="logoutBtn">退出登录</button>
    </div>
  </aside>

  <!-- 内容区 -->
  <main class="main">
    <!-- 主页 -->
    <section class="home-view" id="homeView">
      <div class="home-inner">
        <div class="home-card">
          <div class="home-avatar" id="homeAvatar">U</div>
          <div class="home-info">
            <h2 id="homeUsername">用户</h2>
            <p>欢迎回来，这是你的个人主页</p>
          </div>
        </div>
        <div class="home-stats">
          <div class="stat-card">
            <div class="num" id="statConv">0</div>
            <div class="label">会话数量</div>
          </div>
          <div class="stat-card">
            <div class="num" id="statMsg">0</div>
            <div class="label">累计消息</div>
          </div>
        </div>
        <div class="home-actions">
          <button class="primary-btn" id="homeNewChat">开始新会话</button>
          <button class="ghost-btn" id="homeGoChat">查看历史会话</button>
        </div>
      </div>
    </section>

    <!-- 聊天 -->
    <section class="chat-view" id="chatView">
      <div class="topbar">
        <div class="topbar-left">
          <div>
            <div class="topbar-title" id="chatTitle">AI 会话</div>
            <div class="topbar-user" id="topbarUser"></div>
          </div>
        </div>
      </div>

      <div class="messages" id="messages"></div>

      <div class="composer">
        <div class="composer-inner">
          <textarea id="input" placeholder="输入问题，Enter 发送，Shift+Enter 换行"></textarea>
          <button class="send-btn" id="sendBtn" title="发送">
            <svg viewBox="0 0 24 24" fill="none"><path d="M4 12h16m0 0l-6-6m6 6l-6 6" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <div class="hint">回答由大模型生成，仅供参考</div>
      </div>
    </section>
  </main>
</div>

<script src="https://fastly.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://fastly.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
<script>
/* ===== 全局状态 ===== */
const state = {
  token: localStorage.getItem('token') || '',
  username: localStorage.getItem('username') || '',
  userId: localStorage.getItem('userId') || '',
  view: 'home',                 // home | chat
  conversations: [],           // 会话列表
  currentConvId: '',            // 当前会话 ID
  sending: false,
};

const $ = (id) => document.getElementById(id);
const authView = $('authView'), appView = $('appView');
const homeView = $('homeView'), chatView = $('chatView');
const messagesEl = $('messages');

marked.setOptions({ breaks: true, gfm: true });

function renderMarkdown(text) {
  const raw = marked.parse(text || '');
  return DOMPurify.sanitize(raw);
}
function highlightAll(root) {
  if (window.hljs) root.querySelectorAll('pre code').forEach((b) => hljs.highlightElement(b));
}

/* ===== 鉴权 ===== */
let mode = 'login';

function setMode(m) {
  mode = m;
  $('authBtn').textContent = m === 'login' ? '登录' : '注册';
  $('authSub').textContent = m === 'login' ? '登录后开始对话，回答以 Markdown 流式输出' : '创建新账号，开始你的第一次对话';
  $('switchText').textContent = m === 'login' ? '还没有账号？' : '已有账号？';
  $('switchBtn').textContent = m === 'login' ? '去注册' : '去登录';
  $('authErr').textContent = '';
}
$('switchBtn').addEventListener('click', () => setMode(mode === 'login' ? 'register' : 'login'));

async function api(path, body, method) {
  const headers = { 'Content-Type': 'application/json' };
  if (state.token) headers['Authorization'] = 'Bearer ' + state.token;
  const resp = await fetch(path, {
    method: method || (body ? 'POST' : 'GET'),
    headers,
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await resp.json().catch(() => ({}));
  if (!resp.ok) throw new Error(data.detail || '请求失败');
  return data;
}

$('authBtn').addEventListener('click', doAuth);
$('password').addEventListener('keydown', (e) => { if (e.key === 'Enter') doAuth(); });

async function doAuth() {
  const username = $('username').value.trim();
  const password = $('password').value;
  if (!username || !password) { $('authErr').textContent = '用户名和密码不能为空'; return; }
  $('authErr').textContent = '';
  try {
    const data = await api('/api/' + mode, { username, password });
    state.token = data.token;
    state.username = data.username;
    state.userId = data.user_id;
    localStorage.setItem('token', data.token);
    localStorage.setItem('username', data.username);
    localStorage.setItem('userId', data.user_id);
    enterApp();
  } catch (e) {
    $('authErr').textContent = e.message;
  }
}

$('logoutBtn').addEventListener('click', () => {
  localStorage.removeItem('token');
  localStorage.removeItem('username');
  localStorage.removeItem('userId');
  state.token = ''; state.username = ''; state.userId = '';
  location.reload();
});

/* ===== 视图切换 ===== */
function showView(view) {
  state.view = view;
  homeView.style.display = view === 'home' ? 'block' : 'none';
  chatView.style.display = view === 'chat' ? 'flex' : 'none';
  $('navHome').classList.toggle('active', view === 'home');
  $('navChat').classList.toggle('active', view === 'chat');
}

$('navHome').addEventListener('click', () => showView('home'));
$('navChat').addEventListener('click', () => {
  // 没有会话则先建一个
  if (!state.currentConvId) createConversation();
  showView('chat');
});
$('navNew').addEventListener('click', () => createConversation());
$('homeNewChat').addEventListener('click', () => createConversation());
$('homeGoChat').addEventListener('click', () => showView('chat'));

/* ===== 会话列表 ===== */
async function loadConversations() {
  try {
    const data = await api('/api/conversations');
    state.conversations = data.conversations || [];
    renderConvList();
  } catch (e) {
    state.conversations = [];
    renderConvList();
  }
  // 主页统计：会话数 / 消息数
  try {
    const me = await api('/api/me');
    $('statConv').textContent = me.conversation_count ?? state.conversations.length;
    $('statMsg').textContent = me.message_count ?? 0;
  } catch (e) {
    $('statConv').textContent = state.conversations.length;
  }
}

function renderConvList() {
  const list = $('convList');
  list.innerHTML = '';
  if (!state.conversations.length) {
    list.innerHTML = '<div class="conv-empty">暂无历史会话</div>';
    return;
  }
  for (const conv of state.conversations) {
    const btn = document.createElement('button');
    btn.className = 'conv-item' + (conv.conversation_id === state.currentConvId ? ' active' : '');
    btn.innerHTML = '<span class="conv-title"></span>';
    btn.querySelector('.conv-title').textContent = conv.title || '新会话';
    btn.addEventListener('click', () => switchConversation(conv.conversation_id));
    list.appendChild(btn);
  }
}

async function createConversation() {
  try {
    const data = await api('/api/conversations', { title: '新会话' });
    state.currentConvId = data.conversation_id;
    await loadConversations();
    showView('chat');
    renderEmpty();
  } catch (e) {
    alert('新建会话失败：' + e.message);
  }
}

async function switchConversation(convId) {
  if (convId === state.currentConvId) { showView('chat'); return; }
  state.currentConvId = convId;
  renderConvList();
  showView('chat');
  await loadHistory();
}

/* ===== 聊天渲染 ===== */
function addMessage(role, content) {
  const row = document.createElement('div');
  row.className = 'msg-row ' + (role === 'user' ? 'user' : 'ai');
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = role === 'user' ? state.username.slice(0, 1).toUpperCase() : 'AI';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  if (role === 'ai') {
    bubble.innerHTML = renderMarkdown(content);
    highlightAll(bubble);
  } else {
    bubble.textContent = content;
  }
  row.appendChild(avatar);
  row.appendChild(bubble);
  messagesEl.appendChild(row);
  scrollBottom();
  return bubble;
}

function scrollBottom() { messagesEl.scrollTop = messagesEl.scrollHeight; }

function renderEmpty() {
  messagesEl.innerHTML = '';
  const empty = document.createElement('div');
  empty.className = 'empty';
  empty.innerHTML = '<div class="big">有什么可以帮你？</div><p>在下方输入问题，AI 会逐字流式回答，支持 Markdown 与代码块</p>';
  messagesEl.appendChild(empty);
}

async function loadHistory() {
  if (!state.currentConvId) { renderEmpty(); return; }
  try {
    const data = await api('/api/history?conversation_id=' + encodeURIComponent(state.currentConvId));
    messagesEl.innerHTML = '';
    if (!data.messages.length) { renderEmpty(); return; }
    data.messages.forEach((m) => addMessage(m.role, m.content));
    // 更新顶部标题为当前会话标题
    const conv = state.conversations.find((c) => c.conversation_id === state.currentConvId);
    if (conv) $('chatTitle').textContent = conv.title || 'AI 会话';
  } catch (e) {
    renderEmpty();
  }
}

/* ===== 流式发送 ===== */
$('sendBtn').addEventListener('click', sendQuestion);
$('input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendQuestion(); }
});

async function sendQuestion() {
  const input = $('input');
  const question = input.value.trim();
  if (!question || state.sending) return;
  if (!state.currentConvId) { await createConversation(); }

  state.sending = true;
  setSending(true);
  const empty = messagesEl.querySelector('.empty');
  if (empty) empty.remove();

  addMessage('user', question);
  input.value = '';
  input.style.height = 'auto';

  const aiBubble = addMessage('ai', '');
  let full = '';
  aiBubble.innerHTML = '<span class="cursor"></span>';

  try {
    const submit = await api('/ai_chat/input_chat', {
      question,
      conversation_id: state.currentConvId,
    });
    const taskId = submit.task_id;
    if (!taskId) throw new Error('未获取到任务编号');

    const resp = await fetch('/ai_chat/stream/' + taskId, {
      headers: { 'Authorization': 'Bearer ' + state.token },
    });
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(err.detail || '请求失败');
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder('utf-8');
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      const events = buffer.split('\n\n');
      buffer = events.pop();
      for (const evt of events) {
        const lines = evt.split('\n');
        let eventName = 'message', dataStr = '';
        for (const line of lines) {
          if (line.startsWith('event:')) eventName = line.slice(6).trim();
          else if (line.startsWith('data:')) dataStr += line.slice(5).trim();
        }
        if (!dataStr) continue;
        let data;
        try { data = JSON.parse(dataStr); } catch { continue; }

        if (eventName === 'delta') {
          full += data.content;
          aiBubble.innerHTML = renderMarkdown(full) + '<span class="cursor"></span>';
          highlightAll(aiBubble);
          scrollBottom();
        } else if (eventName === 'done') {
          full = data.content || full;
          aiBubble.innerHTML = renderMarkdown(full);
          highlightAll(aiBubble);
          // 回答完成后刷新会话列表（标题可能已更新）
          loadConversations();
        } else if (eventName === 'error') {
          aiBubble.innerHTML = renderMarkdown('> 出错了：' + (data.detail || '未知错误'));
        }
      }
    }
  } catch (e) {
    aiBubble.innerHTML = renderMarkdown('> 请求失败：' + e.message);
  } finally {
    state.sending = false;
    setSending(false);
    scrollBottom();
  }
}

function setSending(flag) {
  $('sendBtn').disabled = flag;
  $('input').disabled = flag;
}

$('input').addEventListener('input', (e) => {
  e.target.style.height = 'auto';
  e.target.style.height = Math.min(e.target.scrollHeight, 160) + 'px';
});

/* ===== 启动 ===== */
async function enterApp() {
  authView.style.display = 'none';
  appView.style.display = 'flex';
  const initial = state.username.slice(0, 1).toUpperCase() || 'U';
  $('sideAvatar').textContent = initial;
  $('homeAvatar').textContent = initial;
  $('sideUsername').textContent = state.username;
  $('homeUsername').textContent = state.username;
  $('topbarUser').textContent = state.username;

  await loadConversations();
  // 默认进主页；若已有会话则定位最近一条
  if (state.conversations.length) {
    state.currentConvId = state.conversations[0].conversation_id;
  }
  showView('home');
}

if (state.token) {
  enterApp();
} else {
  setMode('login');
}
</script>
